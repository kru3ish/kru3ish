# Contribution snake.
# Copy to .github/workflows/snake.yml inside the kru3ish/kru3ish repo,
# then Actions → "generate snake" → Run workflow (once, to create the output branch).
name: generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        id: snake
        with:
          github_user_name: kru3ish
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=%238b5cf6

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
